# Docker Compose mẫu cho base API.
# - Phơi đầy đủ biến môi trường cần thiết (đọc từ .env hoặc shell, có giá trị mặc định cho dev).
# - Mount thư mục logs ra host để xem log trực tiếp.
# - KHÔNG tự publish port ra host — điểm vào DUY NHẤT là nginx DÙNG CHUNG với project frontend
#   (angular-enterprise-starter), nằm ở E:/study/shared-nginx (network "shared-edge"). Xem
#   docker/nginx/default.conf.template (đã chuyển sang bên đó) để biết route /base/** -> service này.
#   Cần tạo network 1 lần: `docker network create shared-edge` trước khi lên bất kỳ project nào.
# Chạy:  docker compose up --build -d
# Xem:   curl http://localhost:8386/base/actuator/health   (qua shared-nginx)
# Dừng:  docker compose down

services:
  base-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: base-api:latest
    container_name: base-api
    environment:
      # Profile: dev (mặc định) | uat | prod
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # Bí mật dùng chung — BẮT BUỘC đặt giá trị thật ở prod.
      APP_SECURITY: ${APP_SECURITY:-change-me-in-env}
      # Khóa ký JWT. Dev dùng khóa bundled trong jar (classpath). Prod: mount khóa ngoài (xem volumes).
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-keys/public.pem}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-keys/private.pem}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-86400}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-172800}
      # Domain CDN gốc cho URL media.
      CDN_MEDIA_DOMAIN: ${CDN_MEDIA_DOMAIN:-https://base-cdn.example}
      # CORS — KHÔNG dùng "*" ở prod.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Oracle (dev_e_commerce schema) — chạy standalone (container oracle-xe), không chung compose network
      # với base-api nên phải trỏ qua host.docker.internal (Docker Desktop) thay vì localhost.
      DB_DWH_URL: ${DB_DWH_URL:-jdbc:oracle:thin:@host.docker.internal:1521/XE}
      DB_DWH_USERNAME: ${DB_DWH_USERNAME:-dev}
      DB_DWH_PASSWORD: ${DB_DWH_PASSWORD:-Hieu123456789a}
      # MongoDB cũng standalone tương tự — không bắt buộc (client kết nối lười) nhưng trỏ đúng cho khỏi lỗi log.
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/base}
      # Keycloak (login v2) — cũng standalone (docker/keycloak/docker-compose.yml riêng), trỏ qua
      # host.docker.internal tương tự Oracle/Mongo ở trên.
      KEYCLOAK_LOGIN_ENABLED: ${KEYCLOAK_LOGIN_ENABLED:-false}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-http://host.docker.internal:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-base-realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-base-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # RBAC động theo API resource (User/Role/Permission/Menu) — xem sql/oracle/rbac.sql.
      RBAC_ENABLED: ${RBAC_ENABLED:-false}
      # Thư mục lưu file upload (ảnh/video). Default dev (E:/storage) là path Windows nên KHÔNG dùng được
      # trong container Linux — phải trỏ path Linux + mount ra host để giữ file qua các lần recreate container.
      STORAGE_ROOT_DIR: ${STORAGE_ROOT_DIR:-/app/storage}
      # nginx đứng trước (service bên dưới) -> để nó tự phục vụ file qua sendfile thay vì app stream.
      STORAGE_NGINX_ACCEL_REDIRECT_ENABLED: ${STORAGE_NGINX_ACCEL_REDIRECT_ENABLED:-true}
    extra_hosts:
      # Linux Docker Engine không tự có host.docker.internal như Docker Desktop — khai báo tường minh.
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount logs ra host (app ghi vào /app/logs: main.log, error.log, request.log).
      - ./logs:/app/logs
      # Mount thư mục lưu file upload ra host để không mất khi container bị recreate.
      - ./storage:/app/storage
      # Prod: bỏ comment để mount khóa JWT từ host, rồi đặt JWT_*_KEY_PATH = /app/keys/*.pem
      # - ./keys:/app/keys:ro
    healthcheck:
      # Kiểm tra nhẹ: cổng 8386 đã listen chưa (không cần cài thêm curl trong image).
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8386' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - default
      - shared-edge
    restart: unless-stopped

networks:
  default: {}
  shared-edge:
    external: true
