# Bundle mặc định (fallback khi không khớp ngôn ngữ nào) — nội dung tiếng Anh.
# Mỗi mã trong AppCode phải có một key tương ứng ở ĐÂY và trong từng file ngôn ngữ (messages_<lang>.properties).
CODE_200=Success
CODE_400=Bad request
CODE_401=Verify failed
CODE_402=Validation failed
CODE_403=Forbidden
CODE_404=Not found
CODE_429=Too many requests
CODE_500=Internal server error
UNKNOWN=Unknown error
TOKEN_IS_NOT_REFRESH=Token is not a refresh token
TOKEN_INVALID=Token is invalid
