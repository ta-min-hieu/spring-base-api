# Cấu hình bảo mật DEV: bí mật dùng chung, JWT, CORS. Không đặt bí mật thật ở đây.
required:
  authentication: true

# Ghi đè qua biến môi trường APP_SECURITY khi chạy thật.
app-security: ${APP_SECURITY:change-me-in-env}

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    access-ttl: ${JWT_ACCESS_TTL:86400}
    refresh-ttl: ${JWT_REFRESH_TTL:172800}
  cors:
    # "*" tiện cho dev; phải siết lại ở prod.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # Login v2 (Keycloak) + xác thực song song token Keycloak trên các API khác. Tắt mặc định.
  keycloak:
    enabled: ${KEYCLOAK_LOGIN_ENABLED:false}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:base-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:base-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  # RBAC động theo API resource (DynamicPermissionFilter + PERM_<code> authority). Tắt mặc định —
  # khi tắt, hệ thống chỉ còn kiểm tra ROLE_ tĩnh như trước (không đổi hành vi hiện có).
  rbac:
    enabled: ${RBAC_ENABLED:false}
    super-admin-roles:
      - ADMIN
    excluded-paths:
      - /v1/auth
      - /v2/auth
      - /troubleshoot
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /swagger-ui.html
      - /v1/core/bonus-turn
      - /v1/rbac/me
