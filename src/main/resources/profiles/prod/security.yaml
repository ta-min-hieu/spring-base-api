# Cấu hình bảo mật PROD: mọi giá trị nhạy cảm BẮT BUỘC lấy từ biến môi trường (thiếu là fail).
required:
  authentication: true

app-security: ${APP_SECURITY}

app:
  jwt:
    # Trỏ tới khóa mount từ bên ngoài, không đóng gói khóa private vào jar.
    public-key: ${JWT_PUBLIC_KEY_PATH}
    private-key: ${JWT_PRIVATE_KEY_PATH}
    access-ttl: ${JWT_ACCESS_TTL:86400}
    refresh-ttl: ${JWT_REFRESH_TTL:172800}
  cors:
    # Không dùng "*" ở prod — phải là danh sách origin tường minh.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  keycloak:
    enabled: ${KEYCLOAK_LOGIN_ENABLED:false}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
  rbac:
    enabled: ${RBAC_ENABLED:false}
    super-admin-roles:
      - ADMIN
    excluded-paths:
      - /v1/auth
      - /v2/auth
      - /troubleshoot
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /swagger-ui.html
      - /v1/core/bonus-turn
      - /v1/rbac/me
