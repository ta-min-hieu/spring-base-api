# Cấu hình bảo mật PROD: mọi giá trị nhạy cảm BẮT BUỘC lấy từ biến môi trường (thiếu là fail).
required:
  authentication: true

app-security: ${APP_SECURITY}

app:
  jwt:
    # Trỏ tới khóa mount từ bên ngoài, không đóng gói khóa private vào jar.
    public-key: ${JWT_PUBLIC_KEY_PATH}
    private-key: ${JWT_PRIVATE_KEY_PATH}
    access-ttl: ${JWT_ACCESS_TTL:86400}
    refresh-ttl: ${JWT_REFRESH_TTL:172800}
  cors:
    # Không dùng "*" ở prod — phải là danh sách origin tường minh.
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
