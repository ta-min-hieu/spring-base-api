# Cấu hình bảo mật UAT: bí mật và khóa lấy từ biến môi trường, có giá trị mặc định dự phòng.
required:
  authentication: true

app-security: ${APP_SECURITY:change-me-in-env}

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
    private-key: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    access-ttl: ${JWT_ACCESS_TTL:86400}
    refresh-ttl: ${JWT_REFRESH_TTL:172800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  keycloak:
    enabled: ${KEYCLOAK_LOGIN_ENABLED:false}
    auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:base-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:base-api}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  rbac:
    enabled: ${RBAC_ENABLED:false}
    super-admin-roles:
      - ADMIN
    excluded-paths:
      - /v1/auth
      - /v2/auth
      - /troubleshoot
      - /actuator
      - /v3/api-docs
      - /swagger-ui
      - /swagger-ui.html
      - /v1/core/bonus-turn
      - /v1/rbac/me
