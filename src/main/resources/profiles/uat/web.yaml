# Cấu hình tầng web: i18n, tài liệu OpenAPI/Swagger và media.
spring:
  messages:
    basename: i18n/messages
    encoding: UTF-8
    # Không khớp ngôn ngữ -> dùng bundle mặc định (messages.properties), không phụ thuộc locale của máy chủ.
    fallback-to-system-locale: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  domain:
    cdn:
      media: ${CDN_MEDIA_DOMAIN:https://base-cdn.example}
  img:
    default: default
  audio:
    default: default
  avatar:
    default: default
  storage:
    root-dir: ${STORAGE_ROOT_DIR:/data/storage}
    max-image-size: ${STORAGE_MAX_IMAGE_SIZE:10MB}
    max-video-size: ${STORAGE_MAX_VIDEO_SIZE:200MB}
    allowed-image-types: ${STORAGE_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/gif,image/webp}
    allowed-video-types: ${STORAGE_ALLOWED_VIDEO_TYPES:video/mp4,video/quicktime,video/x-msvideo,video/webm}
    min-chunk-size: ${STORAGE_MIN_CHUNK_SIZE:256KB}
    max-chunk-size: ${STORAGE_MAX_CHUNK_SIZE:20MB}
    chunk-session-ttl: ${STORAGE_CHUNK_SESSION_TTL:2h}
    max-chunk-sessions: ${STORAGE_MAX_CHUNK_SESSIONS:1000}
